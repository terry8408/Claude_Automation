<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월별 매출 차트</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --bar: #38bdf8;
    --bar-hover: #0ea5e9;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    padding: 32px 36px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    height: 240px;
    padding-bottom: 28px;
    position: relative;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    cursor: pointer;
  }
  .bar {
    width: 36px;
    background: var(--bar);
    border-radius: 6px 6px 0 0;
    transition: background .2s, transform .2s;
  }
  .col:hover .bar {
    background: var(--bar-hover);
    transform: scaleY(1.03);
    transform-origin: bottom;
  }
  .label {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #f8fafc;
    color: #0f172a;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    transform: translate(-50%, -8px);
    transition: opacity .15s;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>월별 매출 현황</h1>
    <p class="sub">막대에 마우스를 올려 보세요 · 단위: 만원</p>
    <div class="chart" id="chart"></div>
  </div>
  <div class="tooltip" id="tooltip"></div>

<script>
  const data = [
    { month: "1월", value: 42 },
    { month: "2월", value: 58 },
    { month: "3월", value: 35 },
    { month: "4월", value: 71 },
    { month: "5월", value: 64 },
    { month: "6월", value: 89 },
  ];

  const chart = document.getElementById("chart");
  const tooltip = document.getElementById("tooltip");
  const max = Math.max(...data.map(d => d.value));

  data.forEach(d => {
    const col = document.createElement("div");
    col.className = "col";

    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = (d.value / max * 100) + "%";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = d.month;

    col.appendChild(bar);
    col.appendChild(label);

    col.addEventListener("mousemove", e => {
      tooltip.style.opacity = "1";
      tooltip.style.left = e.clientX + "px";
      tooltip.style.top = e.clientY + "px";
      tooltip.textContent = `${d.month}: ${d.value}만원`;
    });
    col.addEventListener("mouseleave", () => {
      tooltip.style.opacity = "0";
    });

    chart.appendChild(col);
  });
</script>
</body>
</html>
